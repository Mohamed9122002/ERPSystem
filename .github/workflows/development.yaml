name: .NET CI/CD

on:
  push:
    branches: [ "development" ]

jobs:
  ci:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        path: ERP

    - name: Restore
      working-directory: ERP
      shell: cmd
      run: dotnet restore ERPSystem.PresentationLayer\ERPSystem.PresentationLayer.csproj

    - name: Build
      working-directory: ERP
      shell: cmd
      run: dotnet build ERPSystem.PresentationLayer\ERPSystem.PresentationLayer.csproj --configuration Release --no-restore

    - name: Publish
      working-directory: ERP
      shell: cmd
      run: dotnet publish ERPSystem.PresentationLayer\ERPSystem.PresentationLayer.csproj -c Release -o C:\deploy\erp\publish


  cd:
    needs: ci
    runs-on: self-hosted

    steps:
    - name: Stop app
      shell: cmd
      run: taskkill /IM ERPSystem.PresentationLayer.exe /F >nul 2>&1 || exit 0

    - name: Prepare deploy folder
      shell: cmd
      run: if not exist C:\apps\erp mkdir C:\apps\erp

    - name: Deploy files
      shell: cmd
      run: xcopy C:\deploy\erp\publish\* C:\apps\erp /E /Y /I

    - name: Start app
      shell: cmd
      run: C:\apps\erp\ERPSystem.PresentationLayer.exe 
